[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monolith-core"
version = "0.2.0"
description = "Obsidian-backed durable agent memory, knowledge cards, context packs, and branch-return checks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "monolith-droid" }
]
keywords = [
  "ai-assisted",
  "agent-memory",
  "obsidian",
  "knowledge-management",
  "coding-agents",
  "context-engineering"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Documentation"
]

[project.scripts]
monolith-core = "monolith_core.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]
